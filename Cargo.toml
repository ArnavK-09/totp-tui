[package]
name = "ratatui-test"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
directories = "6"
keyring = {
    version = "3",
    default-features = false,
    features = [
        "linux-native-sync-persistent",
        "crypto-rust",
    ],
}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
data-encoding = "2.11.1"
tempfile = "3.27.0"
totp-rs = "6.0.0"
